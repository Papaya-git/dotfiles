# Two lines, Catppuccin Mocha colours: rounded capsules for where you are (os, directory,
# branch), plain coloured text for the context on the right.
add_newline = true
palette = "mocha"
format = """
$os$directory$git_branch$git_state$git_status\
$fill\
$status$cmd_duration$jobs$gcloud$kubernetes$aws$terraform$python$time
$character"""

[fill]
symbol = " "

[os]
disabled = false
format = "[](fg:lavender)[$symbol](bg:lavender fg:crust)"

[os.symbols]
Macos = " "

[directory]
truncation_length = 4
truncate_to_repo = false
read_only = " \U000f033e"
format = "[ $path$read_only ](bg:blue fg:crust)[](fg:blue) "

[git_branch]
symbol = " "
format = "[](fg:green)[$symbol$branch](bg:green fg:crust)[](fg:green) "

[git_status]
format = "([$all_status$ahead_behind](fg:yellow) )"
use_git_executable = true

[character]
success_symbol = "[❯](bold fg:mauve)"
error_symbol = "[❯](bold fg:red)"

[status]
disabled = false
format = "[✘ $status]($style) "

[cmd_duration]
min_time = 3000
show_milliseconds = false
format = "[took $duration]($style) "

[jobs]
format = "[$symbol$number]($style) "

[gcloud]
symbol = "\U000f11f6 "
format = "[$symbol$project]($style) "

[kubernetes]
disabled = false
symbol = "\U000f10fe "

[aws]
symbol = " "

[terraform]
symbol = "\U000f1062 "
format = "[$symbol$workspace]($style) "

[python]
symbol = " "
detect_extensions = []
detect_files = []
format = "[$symbol$virtualenv]($style) "

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[$time]($style)"
style = "dimmed white"

[palettes.mocha]
crust = "#11111b"
text = "#cdd6f4"
red = "#f38ba8"
yellow = "#f9e2af"
green = "#a6e3a1"
blue = "#89b4fa"
lavender = "#b4befe"
mauve = "#cba6f7"
